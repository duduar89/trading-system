<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escríbeme</title>
<meta name="robots" content="noindex">
<meta name="description" content="Contacto directo después del concierto.">
<meta name="theme-color" content="#fdfbf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<main>

  <header>
    <h1 class="nombre" id="nombre">…</h1>
    <p class="saludo" id="saludo"></p>
  </header>

  <!-- Solo aparece dentro de Instagram, TikTok o Facebook, donde el enlace de
       WhatsApp no abre la aplicación. -->
  <div class="aviso" id="aviso">
    <strong>Estás dentro de otra aplicación</strong>
    Desde aquí WhatsApp no se abre bien. Toca los tres puntos de arriba y elige
    «Abrir en el navegador», o copia el número y búscame en WhatsApp.
    <button type="button" id="copiar">Copiar el número</button>
    <p class="copiado" id="copiado">Copiado. Pégalo en WhatsApp.</p>
  </div>

  <!-- Un solo botón manda. Todo lo demás va por debajo y con menos peso: si
       compiten, la gente guarda el contacto, no escribe, y ella se queda sin el
       número y sin el rastro de que le han dado permiso para avisarle. -->
  <a class="boton principal" id="whatsapp" href="#" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.22 8.22 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23a8.2 8.2 0 0 1 8.24 8.24c0 4.54-3.7 8.23-8.24 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.79.98-.14.16-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.23-.17-.48-.29z"/>
    </svg>
    <span id="textoWhatsapp">Abrir mi WhatsApp</span>
  </a>

  <!-- La línea que decide si el sistema funciona: el mensaje NO se envía solo. -->
  <p class="empujon" id="avisoEnviar"></p>

  <div class="segundo-plano">
    <a class="suave" id="canal" href="#" hidden>Sígueme en mi canal</a>
    <a class="suave" id="guardar" href="contacto.vcf" download>Guardar mi número en tu móvil</a>
    <span id="secundarios"></span>
  </div>

  <p class="nota" id="nota"></p>

</main>

<script src="ajustes.js"></script>
<script src="puente.js"></script>
</body>
</html>
