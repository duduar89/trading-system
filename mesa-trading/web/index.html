<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f1424">
  <title>Parqué · Mesa de agentes</title>
  <meta name="description" content="Parqué isométrico de la mesa de trading de agentes: quién hace qué, en directo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l9 5v10l-9 5-9-5V7z' fill='%231d4ed8'/%3E%3Cpath d='M12 2l9 5-9 5-9-5z' fill='%2360a5fa'/%3E%3C/svg%3E">
  <script>
    // Si el servidor sirve esta página en «/», los recursos viven en «/web/…» (§7).
    if (location.protocol !== 'file:' && location.pathname === '/') document.write('<base href="/web/">');
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mesa">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/vistas.css">
</head>
<body>
  <div class="app" id="app">
    <header class="barra" id="barra">
      <div class="marca" aria-label="Mesa de agentes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l9 5v10l-9 5-9-5V7z" fill="#1d4ed8"/><path d="M12 2l9 5-9 5-9-5z" fill="#60a5fa"/><path d="M12 12v10l9-5V7z" fill="#1e3a8a"/></svg>
        <span>Parqué</span>
        <span class="pildora maqueta" id="p-maqueta" hidden title="Datos inventados para trabajar la interfaz">MAQUETA</span>
      </div>
      <div class="cifras">
        <button class="cifra cifra-boton" type="button" id="c-patrimonio" data-explica="patrimonio" aria-controls="capital-explica" aria-expanded="false"><span class="rotulo">Patrimonio</span><span class="valor" id="v-patrimonio">—</span></button>
        <div class="cifra"><span class="rotulo">Resultado hoy</span><span class="valor-linea"><span class="valor" id="v-resultado">—</span> <span class="sub" id="v-resultado-pct"></span></span></div>
        <div class="cifra"><span class="rotulo">Caída</span><span class="valor" id="v-caida">—</span></div>
        <div class="cifra secundaria"><span class="rotulo">Exposición</span><span class="valor" id="v-exposicion">—</span></div>
        <div class="cifra secundaria"><span class="rotulo">Posiciones</span><span class="valor" id="v-posiciones">—</span></div>
      </div>
      <div class="pildoras" id="pildoras">
        <span class="pildora gris" id="p-regimen">—</span>
        <span class="pildora gris" id="p-fg">F&amp;G —</span>
        <span class="pildora gris" id="p-comite">Comité —</span>
        <span class="pildora ambar" id="p-nivel" hidden></span>
        <span class="pildora gris" id="p-modo">—</span>
        <span class="pildora gris" id="p-llm">LLM —</span>
      </div>
    </header>

    <section class="capital" id="capital" aria-label="Capital: dónde está el dinero">
      <div class="capital-cifras">
        <button class="cifra cifra-boton" type="button" id="c-invertido" data-explica="invertido" aria-controls="capital-explica" aria-expanded="false"><span class="rotulo">Invertido</span><span class="valor-linea"><span class="valor" id="v-invertido">—</span> <span class="sub" id="v-invertido-pct"></span></span></button>
        <button class="cifra cifra-boton" type="button" id="c-efectivo" data-explica="efectivo" aria-controls="capital-explica" aria-expanded="false"><span class="rotulo">Efectivo</span><span class="valor" id="v-efectivo">—</span></button>
        <button class="cifra cifra-boton" type="button" id="c-disponible" data-explica="disponible" aria-controls="capital-explica" aria-expanded="false"><span class="rotulo">Margen de los límites</span><span class="valor-linea"><span class="valor" id="v-disponible">—</span> <span class="sub" id="v-disponible-nota"></span></span></button>
      </div>
      <div class="reparto">
        <div class="reparto-barra" id="reparto-barra" aria-hidden="true"></div>
        <div class="reparto-tipos" id="reparto-tipos" aria-label="Invertido por tipo de activo"></div>
      </div>
      <p class="capital-explica" id="capital-explica" role="status" aria-live="polite" hidden></p>
    </section>

    <aside class="lateral" id="lateral" aria-label="Mensajes y equipo">
      <div class="lateral-cab">
        <button class="asa" id="asa" type="button" aria-expanded="false" aria-controls="lateral" aria-label="Abrir o cerrar el panel de mensajes y equipo"><span></span></button>
        <div class="pestanas" id="pestanas-lateral" role="tablist" aria-label="Panel lateral">
          <button class="pestana activa" type="button" role="tab" id="pestana-mensajes" data-pestana="mensajes" aria-selected="true" aria-controls="vista-mensajes" tabindex="0">Mensajes <span class="contador" id="contador" title="Mensajes recibidos">0</span></button>
          <button class="pestana" type="button" role="tab" id="pestana-equipo" data-pestana="equipo" aria-selected="false" aria-controls="vista-equipo" tabindex="-1">Equipo <span class="contador" id="contador-equipo" title="Personas en la plantilla"></span></button>
        </div>
      </div>
      <div class="vista" id="vista-mensajes" role="tabpanel" aria-labelledby="pestana-mensajes">
        <div class="chips" id="chips" role="toolbar" aria-label="Filtrar mensajes por departamento"></div>
        <div class="en-curso" id="en-curso" role="status" aria-live="polite" hidden></div>
        <div class="feed" id="feed" role="log" aria-live="polite" aria-relevant="additions" tabindex="0"></div>
        <button class="nuevos" id="nuevos" type="button" hidden>Nuevos ↓</button>
      </div>
      <div class="vista" id="vista-equipo" role="tabpanel" aria-labelledby="pestana-equipo" hidden>
        <div class="buscador">
          <input class="campo" id="buscar-equipo" type="search" placeholder="Buscar por nombre o puesto" aria-label="Buscar a alguien del equipo por nombre o puesto" autocomplete="off" spellcheck="false">
        </div>
        <div class="equipo" id="equipo"></div>
      </div>
    </aside>

    <main class="escena" id="escena">
      <canvas id="lienzo" role="img" aria-label="Parqué isométrico de la mesa: pulsa un puesto, una persona o el rótulo de una mesa para ver su ficha. Arrastra para mover, rueda o pellizco para acercar. Con el teclado: flechas para mover, + y − para acercar, n y p para recorrer puestos y personas, Intro para abrir la ficha." tabindex="0"></canvas>
      <p class="visualmente-oculto" id="anuncio" role="status" aria-live="polite"></p>
      <div class="franja" id="franja" role="status" hidden>Sin conexión con la mesa, reintentando…</div>
      <div class="avisos" id="avisos" aria-label="Avisos"></div>
      <section class="tarjeta" id="tarjeta" hidden aria-labelledby="tarjeta-titulo"></section>
    </main>

    <nav class="botonera" id="botonera" aria-label="Mandos de la mesa">
      <button class="boton" id="abrir-vistas" type="button" aria-expanded="false" aria-controls="vistas" aria-label="Informes" title="Informes: evolución, estrategias, noticias, decisiones y laboratorio"><svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M5 15l4-5 4 3 6-7"/></svg><span>Informes</span></button>
      <div class="acciones" id="acciones"></div>
      <div class="camara" id="camara" aria-label="Cámara"></div>
    </nav>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modal-titulo">
    <div class="modal-cuerpo" id="modal-cuerpo"></div>
  </dialog>
  <div class="tostadas" id="tostadas" aria-live="polite"></div>

  <script src="js/cifras.js"></script>
  <script src="js/iso.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/dibujo.js"></script>
  <script src="js/personajes.js"></script>
  <script src="js/caras.js"></script>
  <script src="js/paneles.js"></script>
  <script src="js/reproductor.js"></script>
  <script src="js/maqueta.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/graficas.js"></script>
  <script src="js/vistas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
