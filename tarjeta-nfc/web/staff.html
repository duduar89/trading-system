<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mostrador · Tarjeta de puntos</title>
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<main>
  <nav><a href="/staff.html">Mostrador</a><a href="/alta.html">Alta de tarjeta</a></nav>

  <section id="acceso" hidden>
    <h1>Entrar</h1>
    <div class="tarjeta">
      <label for="pin">PIN de empleado</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="····">
      <button id="entrar">Entrar</button>
      <div id="errorAcceso"></div>
    </div>
  </section>

  <section id="mostrador" hidden>
    <h1 id="saludo">Mostrador</h1>

    <div class="tarjeta" id="cajaImporte" hidden>
      <label for="importe">Importe del ticket (€)</label>
      <input id="importe" type="text" inputmode="decimal" placeholder="0,00">
    </div>

    <div class="lector" id="lector">
      <span class="onda" aria-hidden="true">((•))</span>
      <strong id="lectorTexto">Preparando el lector…</strong>
      <p class="suave" id="lectorPista"></p>
    </div>

    <div id="salida"></div>

    <div class="tarjeta" id="manual" hidden>
      <label for="uidManual">Sin NFC: teclea el número de la tarjeta</label>
      <input id="uidManual" placeholder="04A1B2C3D4E5F6">
      <button class="secundario" id="enviarManual">Sumar puntos</button>
    </div>

    <p class="suave centro" id="estadoCola"></p>
    <button class="secundario" id="salir">Cerrar sesión</button>
  </section>
</main>

<script type="module">
import { $, api, sesion, escuchar, hayNfc, claveIdem, encolar, vaciarCola, pendientes } from '/comun.js';

let config = { modo: 'sellos', objetivo_sellos: 10, recompensas: [] };
let pararLector = () => {};
let ultimo = null;                       // ultimo cliente leido, para el canje

const importeCents = () => {
  const bruto = $('#importe').value.trim().replace(',', '.');
  if (!bruto) return null;
  const n = Number(bruto);
  return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) : null;
};

function pintar(html) { $('#salida').innerHTML = html; }

function sellos(n, objetivo) {
  const marcados = Math.min(n, objetivo);
  return `<div class="sellos">${
    Array.from({ length: objetivo }, (_, i) =>
      `<span class="sello ${i < marcados ? 'lleno' : ''}">${i < marcados ? '✓' : ''}</span>`).join('')
  }</div>`;
}

function pintarResultado(d) {
  const puedeCanjear = config.recompensas.filter((r) => d.saldo >= r.coste_puntos);
  const cabecera = config.modo === 'sellos'
    ? `${sellos(d.sellos || (d.saldo % config.objetivo_sellos), config.objetivo_sellos)}
       <p class="centro suave">${d.sellos} de ${config.objetivo_sellos} sellos</p>`
    : `<p class="grande">${d.saldo}</p><p class="centro suave">puntos</p>`;

  pintar(`
    <div class="tarjeta">
      <div class="estado ok">${d.repetido ? 'Ya estaba apuntado' : `+${d.sumados}`} · ${d.nombre ?? 'Cliente'}</div>
      ${cabecera}
      ${d.detalle?.multiplicadores?.length ? `<p class="centro suave">${d.detalle.multiplicadores.join(' · ')}</p>` : ''}
      ${puedeCanjear.length ? `<h2>Puede canjear</h2>${puedeCanjear.map((r) =>
        `<button data-canje="${r.id}">${r.nombre} · ${r.coste_puntos} pts</button>`).join('')}` : ''}
    </div>`);

  document.querySelectorAll('[data-canje]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      const r = await api('POST', '/api/canjear',
        { cliente_id: d.cliente_id, recompensa_id: Number(b.dataset.canje), idem: claveIdem() });
      pintar(r.ok
        ? `<div class="estado ok">Canjeado: ${r.datos.recompensa}. Le quedan ${r.datos.saldo} puntos.</div>`
        : `<div class="estado error">${r.datos.error}</div>`);
    };
  });
}

async function sumar(tarjeta) {
  const cuerpo = { ...tarjeta, importe_cents: importeCents(), idem: claveIdem() };
  if (config.modo !== 'sellos' && cuerpo.importe_cents == null) {
    return pintar('<div class="estado aviso">Falta el importe del ticket.</div>');
  }
  if (!navigator.onLine) {
    encolar('/api/tap', cuerpo);
    refrescarCola();
    return pintar('<div class="estado aviso">Sin conexión. Apuntado; se enviará solo al volver el wifi.</div>');
  }

  let r;
  try { r = await api('POST', '/api/tap', cuerpo); }
  catch {
    encolar('/api/tap', cuerpo);
    refrescarCola();
    return pintar('<div class="estado aviso">No hay red. Apuntado para enviarlo luego.</div>');
  }

  $('#importe').value = '';
  if (r.ok) { ultimo = r.datos; return pintarResultado(r.datos); }
  if (r.datos.alta_necesaria) {
    return pintar(`<div class="estado aviso">Tarjeta nueva.
      <a href="/alta.html?uid=${encodeURIComponent(tarjeta.uid ?? '')}">Darla de alta →</a></div>`);
  }
  pintar(`<div class="estado error">${r.datos.error ?? 'No se pudo sumar'}</div>`);
}

function refrescarCola() {
  const n = pendientes();
  $('#estadoCola').textContent = n ? `${n} operación(es) pendientes de enviar` : '';
}

async function arrancarLector() {
  const caja = $('#lector');
  if (!hayNfc()) {
    caja.classList.remove('escuchando');
    $('#lectorTexto').textContent = 'Este móvil no lee NFC desde el navegador';
    $('#lectorPista').innerHTML = 'En iPhone el navegador no puede leer NFC. Usa un Android, o teclea el número. Ver <code>docs/03-hardware.md</code>.';
    $('#manual').hidden = false;
    return;
  }
  $('#lectorTexto').textContent = 'Acerca la tarjeta';
  $('#lectorPista').textContent = config.modo === 'sellos'
    ? 'Un toque y listo' : 'Escribe el importe y acerca la tarjeta';
  caja.classList.add('escuchando');
  pararLector = await escuchar(
    (tarjeta) => { navigator.vibrate?.(40); sumar(tarjeta); },
    (e) => {
      caja.classList.remove('escuchando');
      $('#lectorTexto').textContent = 'No se pudo activar el lector';
      $('#lectorPista').textContent = e.message + ' · Comprueba que el NFC del móvil está encendido y que la página va por HTTPS.';
      $('#manual').hidden = false;
    });
}

async function entrar() {
  const r = await api('POST', '/api/sesion', { pin: $('#pin').value });
  if (!r.ok) { $('#errorAcceso').innerHTML = `<div class="estado error">${r.datos.error}</div>`; return; }
  sesion.guardar(r.datos.token, r.datos.staff);
  iniciar();
}

async function iniciar() {
  if (!sesion.token) { $('#acceso').hidden = false; $('#mostrador').hidden = true; return; }
  $('#acceso').hidden = true; $('#mostrador').hidden = false;
  config = (await api('GET', '/api/config')).datos;
  $('#saludo').textContent = `Hola, ${sesion.quien?.nombre ?? ''}`;
  // El importe hace falta si los puntos dependen de el, o si hay consumo minimo.
  $('#cajaImporte').hidden = config.modo === 'sellos' && !config.importe_minimo_cents;
  await arrancarLector();
  refrescarCola();
  await vaciarCola(); refrescarCola();
}

$('#entrar').onclick = entrar;
$('#pin').onkeydown = (e) => { if (e.key === 'Enter') entrar(); };
$('#salir').onclick = () => { pararLector(); sesion.cerrar(); location.reload(); };
$('#enviarManual').onclick = () => {
  const uid = $('#uidManual').value.trim();
  if (uid) { sumar({ uid }); $('#uidManual').value = ''; }
};
addEventListener('online', async () => { await vaciarCola(); refrescarCola(); });
iniciar();
</script>
</body>
</html>
